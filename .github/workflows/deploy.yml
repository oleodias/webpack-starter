# Publica o site no GitHub Pages a cada push na main: o GitHub instala as
# dependências, roda o build e publica a pasta dist/. Nada de dist/ no
# repositório nem de servidor para manter.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Dois pushes seguidos: só a publicação mais nova continua.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
